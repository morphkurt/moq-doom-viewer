<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<!-- "Add to Home Screen" launches truly fullscreen (no Safari chrome) on iOS. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="DOOM" />
		<title>moq-doom</title>
		<!-- Force a cross-origin-isolated context (SharedArrayBuffer for the MoQ audio
		     worklet) on hosts that can't set COOP/COEP headers, e.g. GitHub Pages. -->
		<script src="./coi-serviceworker.js"></script>
		<style>
			:root {
				--bg: #0d0d0f;
				--panel: #17171b;
				--edge: #2a2a30;
				--accent: #b3121a;
				--accent-lit: #ff3b30;
				--text: #e8e8ea;
				--muted: #8a8a92;
				/* Content width: fill the viewport, but cap so the 16:9 stage's
				   height still leaves room for the header + bar. */
				--w: min(98vw, calc((100vh - 116px) * 16 / 9));
			}
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; }
			body {
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, -apple-system, sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
				padding: 16px;
				min-height: 100%;
				overscroll-behavior: none;
			}
			header {
				display: flex;
				align-items: center;
				gap: 14px;
				width: 100%;
				max-width: var(--w);
			}
			h1 {
				font-size: 22px;
				letter-spacing: 3px;
				margin: 0;
				color: var(--accent-lit);
				text-shadow: 0 0 12px rgba(255, 59, 48, 0.4);
				font-weight: 800;
			}
			.grow { flex: 1; }
			.badge {
				font-family: ui-monospace, monospace;
				font-size: 12px;
				padding: 4px 10px;
				border-radius: 999px;
				border: 1px solid var(--edge);
				color: var(--muted);
				white-space: nowrap;
			}
			.badge.connecting { color: #e6b400; border-color: #5a4b00; }
			.badge.live { color: #3ddc6d; border-color: #14512a; box-shadow: 0 0 10px rgba(61, 220, 109, 0.25); }
			.badge.error { color: var(--accent-lit); border-color: #5a1414; }

			#stage {
				position: relative;
				width: 100%;
				max-width: var(--w);
				aspect-ratio: 16 / 9;
				background: #000;
				border: 1px solid var(--edge);
				border-radius: 8px;
				overflow: hidden;
			}
			moq-watch, moq-watch canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			moq-watch canvas { image-rendering: pixelated; object-fit: contain; }
			#overlay {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--muted);
				font-family: ui-monospace, monospace;
				font-size: 14px;
				background: rgba(0, 0, 0, 0.55);
				pointer-events: none;
				transition: opacity 0.4s;
			}
			#overlay.hidden { opacity: 0; }

			/* On-screen touch controls, overlaid on the video. Shown only on touch
			   (coarse-pointer) devices; desktop uses the keyboard. */
			#touch {
				position: absolute;
				inset: 0;
				z-index: 5;
				pointer-events: none; /* only the buttons catch touches */
				display: none;
			}
			@media (pointer: coarse) {
				#touch { display: block; }
				.legend { display: none; } /* keyboard hints are irrelevant on touch */
			}
			.tbtn {
				pointer-events: auto;
				display: flex;
				align-items: center;
				justify-content: center;
				width: 60px;
				height: 60px;
				border-radius: 999px;
				background: rgba(23, 23, 27, 0.42);
				border: 1.5px solid rgba(255, 255, 255, 0.28);
				color: #fff;
				font: 800 15px/1 ui-monospace, monospace;
				user-select: none;
				-webkit-user-select: none;
				touch-action: none;
				-webkit-tap-highlight-color: transparent;
				backdrop-filter: blur(1px);
			}
			.tbtn.held { background: rgba(179, 18, 26, 0.8); border-color: var(--accent-lit); }
			/* Movement D-pad, bottom-left. */
			.dpad {
				position: absolute;
				left: 4%;
				bottom: 9%;
				display: grid;
				grid-template-columns: repeat(3, 58px);
				grid-template-rows: repeat(3, 58px);
				gap: 5px;
			}
			.dpad .tbtn { width: 58px; height: 58px; }
			.dpad .up { grid-area: 1 / 2; }
			.dpad .left { grid-area: 2 / 1; }
			.dpad .right { grid-area: 2 / 3; }
			.dpad .down { grid-area: 3 / 2; }
			/* Fire / use, bottom-right. */
			.acts { position: absolute; right: 4%; bottom: 9%; display: flex; align-items: flex-end; gap: 14px; }
			.acts .use { width: 60px; height: 60px; }
			.acts .fire { width: 90px; height: 90px; background: rgba(179, 18, 26, 0.5); font-size: 16px; }
			/* Menu + weapons, top-right. */
			.topbtns { position: absolute; right: 3%; top: 3%; display: flex; gap: 8px; }
			.topbtns .tbtn { width: 46px; height: 38px; border-radius: 8px; font-size: 13px; }
			/* Fullscreen: let the stage fill the screen (landscape for mobile play).
			   `.immersive` is the iOS fallback: iPhone Safari has no Fullscreen API
			   for non-<video> elements, so we fill the viewport with fixed
			   positioning + dynamic viewport height instead. */
			#stage:fullscreen,
			#stage.immersive {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
				height: 100dvh;
				max-width: none;
				aspect-ratio: auto;
				border: none;
				border-radius: 0;
				z-index: 1000;
			}
			body.immersive-lock { overflow: hidden; }
			/* Exit button, only while filling the screen (real or CSS fullscreen). */
			.tbtn.exit { position: absolute; left: 3%; top: 3%; width: 46px; height: 38px; border-radius: 8px; font-size: 16px; display: none; }
			#stage:fullscreen .exit,
			#stage.immersive .exit { display: flex; }

			#bar {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 100%;
				max-width: var(--w);
				font-size: 13px;
				color: var(--muted);
			}
			#bar .grow { flex: 1; }
			button.ctl {
				background: var(--panel);
				color: var(--text);
				border: 1px solid var(--edge);
				border-radius: 6px;
				padding: 6px 12px;
				font-size: 13px;
				cursor: pointer;
			}
			button.ctl:hover { border-color: var(--accent); }

			/* Quality selector: segmented Auto / High / Low. */
			.seg {
				display: inline-flex;
				border: 1px solid var(--edge);
				border-radius: 6px;
				overflow: hidden;
			}
			.qbtn {
				background: var(--panel);
				color: var(--muted);
				border: 0;
				border-left: 1px solid var(--edge);
				padding: 6px 12px;
				font-size: 13px;
				cursor: pointer;
			}
			.qbtn:first-child { border-left: 0; }
			.qbtn:hover { color: var(--text); }
			.qbtn.active { background: var(--accent); color: #fff; }

			.stats {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				width: 100%;
				max-width: var(--w);
				justify-content: center;
			}
			.stat {
				font-family: ui-monospace, monospace;
				font-size: 12px;
				color: var(--muted);
				background: var(--panel);
				border: 1px solid var(--edge);
				border-radius: 6px;
				padding: 5px 10px;
			}
			.stat b { color: var(--text); font-size: 14px; }
			.stat.warn b { color: #e6b400; }
			.stat.bad b { color: var(--accent-lit); }
			.legend {
				max-width: var(--w);
				text-align: center;
				color: var(--muted);
				font-size: 12.5px;
				line-height: 1.6;
			}
			.legend kbd {
				background: #23232a;
				border: 1px solid var(--edge);
				border-radius: 4px;
				padding: 1px 6px;
				font-family: ui-monospace, monospace;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>DOOM</h1>
			<span class="grow"></span>
			<span id="status" class="badge connecting">connecting…</span>
		</header>

		<div id="stage">
			<moq-watch id="player"><canvas></canvas></moq-watch>
			<div id="overlay">connecting to stream…</div>
			<div id="touch">
				<button type="button" class="tbtn exit" id="exit" title="Exit fullscreen">✕</button>
				<div class="dpad">
					<button type="button" class="tbtn up" data-code="ArrowUp">▲</button>
					<button type="button" class="tbtn left" data-code="ArrowLeft">◀</button>
					<button type="button" class="tbtn right" data-code="ArrowRight">▶</button>
					<button type="button" class="tbtn down" data-code="ArrowDown">▼</button>
				</div>
				<div class="acts">
					<button type="button" class="tbtn use" data-code="Space">USE</button>
					<button type="button" class="tbtn fire" data-code="ControlLeft">FIRE</button>
				</div>
				<div class="topbtns">
					<button type="button" class="tbtn" data-code="Digit1">1</button>
					<button type="button" class="tbtn" data-code="Digit2">2</button>
					<button type="button" class="tbtn" data-code="Digit3">3</button>
					<button type="button" class="tbtn" data-code="Escape">ESC</button>
				</div>
			</div>
		</div>

		<div id="bar">
			<span id="session"></span>
			<span class="grow"></span>
			<div id="quality" class="seg" role="group" aria-label="Quality">
				<button type="button" class="qbtn active" data-q="auto">Auto</button>
				<button type="button" class="qbtn" data-q="high">High</button>
				<button type="button" class="qbtn" data-q="low">Low</button>
			</div>
			<button id="play" class="ctl">🎮 Play</button>
			<button id="sound" class="ctl">🔇 Sound off</button>
			<button id="fs" class="ctl">⛶ Fullscreen</button>
		</div>

		<div id="stats" class="stats" hidden>
			<span class="stat"><b id="s-fps">–</b> fps</span>
			<span class="stat" id="stat-drop"><b id="s-drop">–</b>% dropped</span>
			<span class="stat"><b id="s-enc">–</b> ms encode</span>
			<span class="stat" id="stat-lat"><b id="s-lat">–</b> ms latency</span>
			<span class="stat"><b id="s-viewers">–</b> playing</span>
		</div>

		<p class="legend">
			<kbd>↑↓←→</kbd>/<kbd>WASD</kbd> move · <kbd>Ctrl</kbd> fire · <kbd>Space</kbd> use ·
			<kbd>Shift</kbd> run · <kbd>Enter</kbd>/<kbd>Esc</kbd> menu · <kbd>1–7</kbd> weapons.
		</p>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
